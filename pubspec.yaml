name: supermarket_manager
description: "华人超市管理APP - 支持扫码盘点、库存看板、入出库管理、多语言、离线模式"
publish_to: 'none'
version: 6.30.0+30

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management
  provider: ^6.1.1

  # Local Database
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3

  # Barcode Scanning
  mobile_scanner: ^3.5.5

  # Charts
  fl_chart: ^0.66.0

  # Network & Sync
  connectivity_plus: ^5.0.2
  dio: ^5.4.0
  http: ^1.2.0
  supabase_flutter: ^2.5.6

  # Local Storage (prefs)
  shared_preferences: ^2.2.2

  # UUID generation (for device ID)
  uuid: ^4.2.1

  # Cryptography (password hashing)
  crypto: ^3.0.3

  # UI Utilities
  flutter_slidable: ^3.0.1
  shimmer: ^3.0.0
  dropdown_search: ^5.0.6

  # Date/Time
  timezone: ^0.9.2

  # Permission
  permission_handler: ^11.1.0

  # PDF Export
  pdf: ^3.10.7
  printing: ^5.11.1

dependency_overrides:
  path_provider_android: 2.2.17


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/preset_products.json
