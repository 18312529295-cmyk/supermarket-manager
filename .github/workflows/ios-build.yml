name: 虾觅 iOS 构建
on: [push, workflow_dispatch]

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gen iOS
        run: |
          if [ ! -d "ios" ]; then
            flutter create --project-name supermarket_manager --platforms=ios .
          fi

      - name: Plist
        run: |
          cat > ios/Runner/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleDisplayName</key><string>虾觅</string>
          <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
          <key>CFBundleName</key><string>虾觅</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>$(FLUTTER_BUILD_NAME)</string>
          <key>CFBundleVersion</key><string>$(FLUTTER_BUILD_NUMBER)</string>
          <key>LSRequiresIPhoneOS</key><true/>
          <key>UILaunchStoryboardName</key><string>LaunchScreen</string>
          <key>UIMainStoryboardFile</key><string>Main</string>
          <key>UISupportedInterfaceOrientations</key>
          <array><string>UIInterfaceOrientationPortrait</string></array>
          <key>NSCameraUsageDescription</key><string>barcode scanning</string>
          </dict></plist>
          EOF

      - name: Podfile
        run: |
          cat > ios/Podfile << 'POD'
          platform :ios, '15.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end
          post_install do |i|
            i.pods_project.targets.each do |t|
              flutter_additional_ios_build_settings(t)
              t.build_configurations.each { |c| c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0' }
            end
          end
          POD

      - name: Dependencies
        run: |
          flutter pub get
          cd ios && pod install && cd ..

      - name: Build
        run: flutter build ios --release --no-codesign

      - name: Package
        run: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir -p Payload && cp -r Runner.app Payload/
          zip -r ../ipa/xiaomi.zip Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-ipa
          path: build/ios/ipa/*.zip
          retention-days: 30
