name: 虾觅 iOS 构建

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project
        run: |
          if [ ! -d "ios" ]; then
            flutter create --project-name supermarket_manager --platforms=ios .
          fi

      - name: Write Info.plist
        run: |
          cat > ios/Runner/Info.plist << 'PLISTEOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
<key>CFBundleDevelopmentRegion</key><string>$(DEVELOPMENT_LANGUAGE)</string>
<key>CFBundleDisplayName</key><string>虾觅</string>
<key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
<key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
<key>CFBundleName</key><string>虾觅</string>
<key>CFBundlePackageType</key><string>APPL</string>
<key>CFBundleShortVersionString</key><string>$(FLUTTER_BUILD_NAME)</string>
<key>CFBundleVersion</key><string>$(FLUTTER_BUILD_NUMBER)</string>
<key>LSRequiresIPhoneOS</key><true/>
<key>UILaunchStoryboardName</key><string>LaunchScreen</string>
<key>UIMainStoryboardFile</key><string>Main</string>
<key>UISupportedInterfaceOrientations</key>
<array><string>UIInterfaceOrientationPortrait</string></array>
<key>NSCameraUsageDescription</key><string>扫描商品条码需要访问您的相机</string>
</dict>
</plist>
PLISTEOF

      - name: Write Podfile
        run: |
          cat > ios/Podfile << 'PODEOF'
platform :ios, '15.0'
ENV['COCOAPODS_DISABLE_STATS'] = 'true'
project 'Runner', {'Debug' => :debug, 'Profile' => :release, 'Release' => :release}
def flutter_root
  g = File.expand_path(File.join('..', 'Flutter', 'ephemeral', 'Flutter-Generated.xcconfig'), __FILE__)
  unless File.exist?(g); g = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__) end
  File.foreach(g) { |l| m = l.match(/FLUTTER_ROOT\=(.*)/); return m[1].strip if m }
  raise 'FLUTTER_ROOT not found'
end
require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
flutter_ios_podfile_setup
target 'Runner' do
  use_frameworks!; use_modular_headers!
  flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
end
post_install do |i|
  i.pods_project.targets.each do |t|
    flutter_additional_ios_build_settings(t)
    t.build_configurations.each { |c| c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0' }
  end
end
PODEOF

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios && pod install && cd ..

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../ipa/xiaomi-unsigned.zip Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-ios-ipa
          path: build/ios/ipa/*.zip
          retention-days: 30
