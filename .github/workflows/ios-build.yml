name: 虾觅 iOS 构建
on: [push]
jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: |
          if [ ! -d "ios" ]; then
            flutter create --project-name supermarket_manager --platforms=ios .
          fi
      - run: cd ios && pod init
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-ipa
          path: build/ios/iphoneos/Runner.app
