name: 虾觅 iOS 构建
on: [push]

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: |
          if [ ! -d "ios" ]; then
            flutter create --project-name supermarket_manager --platforms=ios .
          fi

      - run: |
          cat > ios/Runner/Info.plist << 'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0"><dict>
<key>CFBundleDisplayName</key><string>虾觅</string>
<key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
<key>CFBundleName</key><string>虾觅</string>
<key>CFBundlePackageType</key><string>APPL</string>
<key>LSRequiresIPhoneOS</key><true/>
<key>UILaunchStoryboardName</key><string>LaunchScreen</string>
<key>UIMainStoryboardFile</key><string>Main</string>
<key>UISupportedInterfaceOrientations</key>
<array><string>UIInterfaceOrientationPortrait</string></array>
<key>NSCameraUsageDescription</key><string>Barcode scanning for product management</string>
</dict></plist>
PLIST

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-ipa
          path: build/ios/iphoneos/Runner.app
          retention-days: 30
